<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Cubit">
  <title>Cubit</title>
  <!-- The app icon: the cubit mark on the app's own dark ice background.
       The mark itself is design/cubit-mark.svg, scaled into the macOS icon
       grid: an 824pt rounded square inside a 1024pt canvas. -->
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12303f"/>
      <stop offset="1" stop-color="#050f16"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4bd6ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#4bd6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4bd6ff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ice)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <g transform="translate(160,160) scale(11)">
    <!-- isometric ice cube -->
    <polygon points="32,4 56,18 32,32 8,18" fill="#9befff"/>
    <polygon points="8,18 32,32 32,60 8,46" fill="#00d4ff"/>
    <polygon points="32,32 56,18 56,46 32,60" fill="#0086a8"/>
    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="none" stroke="#00475c" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- the top face is a clock showing 3:00 -->
    <g stroke="#04222c" stroke-width="1.8" stroke-linecap="round" fill="none">
      <line x1="32" y1="18" x2="32" y2="9"/>
      <line x1="32" y1="18" x2="41.6" y2="18"/>
    </g>
    <circle cx="32" cy="18" r="1.6" fill="#04222c"/>
  </g>
</svg>
