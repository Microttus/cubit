{% extends "base.html" %}
{% block content %}
  <h1>{{ title }}</h1>

    {% if error.hint %}<p class="muted">{{ error.hint }}</p>{% endif %}
    <p><a class="btn" href="{{ url_for('dashboard.index') }}">Back to the dashboard</a></p>
  </div>
{% endblock %}
