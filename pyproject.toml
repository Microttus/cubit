[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubit"
version = "0.2.0"
description = "Time logging for a one-person company: a CLI and a local web app on plain-text files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "IceCube Solutions" }]
dependencies = [
    "typer>=0.12",
    "flask>=3.0",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# The macOS menu bar app (FR-75). rumps is macOS only, so the marker keeps it
# from being installed anywhere it cannot work.
menubar = ["rumps>=0.4; sys_platform == 'darwin'"]
# Building Cubit.app and its disk image (FR-76). macOS only, like the app.
build = ["pyinstaller>=6.10,<7; sys_platform == 'darwin'"]

[project.scripts]
cubit = "cubit.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The web app's templates, stylesheet, script, logo and fonts ship with it, so
# nothing is fetched from the internet at runtime (FR-35, FR-58).
cubit = [
    "web/templates/*.html",
    "web/static/*",
    "web/static/fonts/*",
    "menubar/assets/*.png",
    "menubar/assets/*.icns",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# launcher.py sits at the repo root rather than in the package: it belongs to
# the app bundle, not to what pip installs. The tests still have to import it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Typer declares options as call-valued defaults; that is the documented API.
"src/cubit/cli/*" = ["B008"]
